name: Generate Garden Manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'garden-manifest.json'

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        run: bash .github/scripts/generate-manifest.sh

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garden-manifest.json
          git diff --cached --quiet || git commit -m "chore: update garden-manifest.json"
          git push
